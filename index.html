<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://kyvrkwqmmyhxtvkbabml.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Autenticação do usuário</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="tema.js"></script>
</head>
<body>

<header class="topo">
  <div class="wrap">
    <div class="marca">
      <button class="simbolo" type="button" id="btn-areas" aria-label="Menu do painel" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-areas" disabled><i></i><i></i><i></i></button>
      <div class="menu-areas" id="menu-areas" role="menu" aria-label="Menu do painel" hidden>
        <div id="itens-areas" role="group" aria-label="Áreas do painel" hidden></div>
        <hr class="menu-sep" id="menu-sep" hidden>
        <div class="menu-aparencia">
          <div class="menu-aparencia-tit" id="tit-aparencia">Aparência</div>
          <div class="seg-tema" role="group" aria-labelledby="tit-aparencia">
            <button type="button" role="menuitemradio" aria-checked="false" data-tema="auto"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="10" height="7" rx="1"/><path d="M1.5 12.5h13"/></svg>Sistema</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-tema="light"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>Claro</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-tema="dark"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>Escuro</button>
          </div>
        </div>
      </div>
      <div class="marca-nome" id="marca-nome" hidden>
        <h1>Fila de Trabalho</h1>
        <small id="subtitulo">Gestão de Processos · 2ª Vara Federal</small>
      </div>
    </div>
    <div class="sou" id="sou" hidden>
      <select id="ver-como" class="ver-como" aria-label="Ver a fila como outra pessoa (somente leitura)" hidden></select>
      <span class="quem" id="quem"></span>
      <button class="btn sair" type="button" id="btn-sair">Sair</button>
    </div>
    <nav class="abas" role="tablist" id="abas" hidden></nav>
  </div>
</header>

<main class="wrap">
  <div id="avisos"></div>
  <section id="v-estado"></section>
  <section id="v-fila" hidden></section>
  <section id="v-eventual" hidden></section>
  <section id="v-geral" hidden></section>
  <section id="v-gestao" hidden></section>
  <section id="v-metas" hidden></section>
  <section id="v-prod" hidden></section>
  <section id="v-emails" hidden></section>
</main>
<div id="modal"></div>
<div id="modal-minuta"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="regras.js"></script>
<script src="metas.js"></script>
<script src="produtividade.js"></script>
<script src="app.js"></script>
<script src="gestao.js"></script>
<script src="metas-ui.js"></script>
<script src="jd-ui.js"></script>
<script src="produtividade-ui.js"></script>
<script src="emails-ui.js"></script>
<script src="minutas-ui.js"></script>
<script src="automacao-ui.js"></script>
</body>
</html>
